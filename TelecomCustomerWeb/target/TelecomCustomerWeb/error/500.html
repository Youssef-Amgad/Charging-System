<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 &middot; Connection Failed</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: 88px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--c-danger), var(--c-amber));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    .error-page h2 { margin-top: 12px; font-size: 20px; }
    .error-page p { color: var(--text-muted); margin-top: 10px; max-width: 400px; }
    .error-page a.btn {
      margin-top: 26px;
      display: inline-flex;
      padding: 12px 22px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--c-cyan), var(--c-violet));
      color: var(--c-navy-950);
      font-weight: 600;
      font-size: 14px;
    }
    .signal-icon { width: 60px; height: 60px; margin-bottom: 20px; color: var(--c-danger); }
  </style>
</head>
<body>
  <div class="error-page">
    <svg class="signal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <line x1="12" y1="15" x2="12" y2="17"/>
    </svg>
    <div class="error-code">500</div>
    <h2>Connection to the network failed</h2>
    <p>Something went wrong on the server side — often a database connectivity hiccup. Please try again in a moment.</p>
    <a class="btn" href="../index.html">Return to Dashboard</a>
  </div>
</body>
</html>
